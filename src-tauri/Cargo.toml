[package]
name = "ps-cafe"
version = "0.1.0"
description = "Offline PlayStation cyber cafe management"
authors = ["PS Cafe"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# LAN gateway (mobile QR access): HTTP server, SQLite, QR, IP discovery.
axum = { version = "0.8", features = ["json", "query", "http1", "tokio"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5" }
tower-http = { version = "0.6", features = ["limit", "timeout"] }
rusqlite = { version = "=0.32.1", features = ["bundled"] }
local-ip-address = "0.6"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
rand = "0.9"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
