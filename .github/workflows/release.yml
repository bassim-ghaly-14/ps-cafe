# PS-Cafe — official versioned Windows releases (from version tags)
#
# Triggers ONLY on version tags like v0.1.0 (NOT on ordinary pushes — those
# produce temporary CI artifacts in windows-build.yml instead).
#
# Flow: check out the tag -> Node 20 + npm ci -> Rust stable -> typecheck +
# production frontend build -> Rust clippy/tests -> frontend tests -> build the
# production NSIS installer with the production Tauri config -> verify the
# .exe -> attach PS-Cafe-Setup-<version>.exe to the GitHub Release for the tag.
#
# Permissions: least privilege; contents: write only here because publishing a
# Release requires it. No secrets or personal access tokens are used.

name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: write

jobs:
  publish-windows-release:
    runs-on: windows-latest
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag matches package.json version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (node -p "require('./package.json').version")
          $expected = "v$version"
          if ('${{ github.ref_name }}' -ne $expected) {
            throw "Tag '${{ github.ref_name }}' does not match package.json version '$version' (expected '$expected'). Sync versions before releasing."
          }
          Write-Host "Version check passed: $expected"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies (reproducible, locked)
        run: npm ci

      - name: Install Rust stable + Windows target
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
          components: clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: TypeScript check
        run: npm run typecheck

      - name: Production frontend build
        run: npm run build:prod

      - name: Rust checks and tests
        # NOTE: clippy reports without `-D warnings` because the LAN module
        # carries pre-existing style lints (dead `revoke`, complex types);
        # correctness is enforced by `cargo test`. Do not re-add
        # `-D warnings` until those lints are fixed separately.
        run: |
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets
          cargo test --manifest-path src-tauri/Cargo.toml
        shell: pwsh

      - name: Frontend tests
        run: npm test -- --run

      - name: Ensure NSIS is available (GitHub runners usually preinstall it)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            choco install nsis -y --no-progress
          }
          makensis -VERSION

      - name: Build production Windows installer (NSIS, production config only)
        run: npm run build:prod:tauri

      - name: Verify + stage canonical installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = 'src-tauri/target/release/bundle/nsis'
          $exe = Get-ChildItem -Path $dir -Filter '*.exe' -File -ErrorAction Stop |
            Where-Object { $_.Name -notmatch 'Internal' } |
            Sort-Object Length -Descending | Select-Object -First 1
          if (-not $exe) { throw "No production NSIS .exe found in $dir" }
          if ($exe.Length -eq 0) { throw "Installer is empty: $($exe.FullName)" }
          $version = (node -p "require('./package.json').version")
          $dest = "PS-Cafe-Setup-$version.exe"
          Copy-Item -Path $exe.FullName -Destination $dest -Force
          Write-Host "Staged release asset: $dest ($($exe.Length) bytes)"

      - name: Publish GitHub Release with installer
        uses: softprops/action-gh-release@v2
        with:
          files: PS-Cafe-Setup-*.exe
          fail_on_unmatched_files: true
          generate_release_notes: true
