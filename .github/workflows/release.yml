# PS-Cafe — official versioned Windows releases (from version tags)
#
# Triggers ONLY on version tags like v0.1.0 (NOT on ordinary pushes — those
# produce temporary CI artifacts in windows-build.yml instead).
#
# Flow: check out the tag -> Node 20 + npm ci -> Rust stable -> typecheck +
# production frontend build -> Rust clippy/tests -> frontend tests -> build the
# production NSIS installer with the production Tauri config -> verify the
# .exe -> attach PS-Cafe-Setup-<version>.exe to the GitHub Release for the tag.
#
# Permissions: least privilege; contents: write only here because publishing a
# Release requires it. No secrets or personal access tokens are used.

name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: write

jobs:
  publish-windows-release:
    runs-on: windows-latest
    steps:
      - name: Checkout tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Verify tag matches package.json version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (node -p "require('./package.json').version")
          $expected = "v$version"
          if ('${{ github.ref_name }}' -ne $expected) {
            throw "Tag '${{ github.ref_name }}' does not match package.json version '$version' (expected '$expected'). Sync versions before releasing."
          }
          Write-Host "Version check passed: $expected"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies (reproducible, locked)
        run: npm ci

      - name: Install Rust stable + Windows target
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
          components: clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      - name: TypeScript check
        run: npm run typecheck

      - name: Production frontend build
        run: npm run build:prod

      - name: Download and extract WebView2 FixedVersion CAB
        shell: pwsh
        run: |
          $cabUrl = "https://msedge.sf.dl.delivery.mp.microsoft.com/filestreamingservice/files/232cf50b-3980-4531-afbb-779f446d7de1/Microsoft.WebView2.FixedVersionRuntime.155.0.4283.62.x64.cab"
          $cabDest = "src-tauri/webview2-runtime.cab"
          $extractDir = "src-tauri/webview2-runtime"
          Write-Host "Downloading WebView2 FixedVersion CAB..."
          Invoke-WebRequest -Uri $cabUrl -OutFile $cabDest
          Write-Host "Creating extraction directory..."
          if (-not (Test-Path $extractDir)) {
            New-Item -ItemType Directory -Path $extractDir | Out-Null
          }
          Write-Host "Extracting WebView2 CAB with Expand.exe..."
          expand.exe -F:* "$cabDest" "$extractDir"
          if (-not (Test-Path $extractDir)) {
            throw "WebView2 CAB extraction failed: extract directory $extractDir was not created"
          }
          # Verify extraction produced actual runtime files
          $files = Get-ChildItem -Path $extractDir -Recurse -File
          if ($files.Count -eq 0) {
            throw "WebView2 CAB extraction produced no files in $extractDir"
          }
          Write-Host "Extracted $($files.Count) files to $extractDir"
          # Clean up the CAB file after extraction
          Remove-Item -Path $cabDest -Force

          # Stage the extracted runtime at the path Tauri's fixedRuntime mode
          # expects (bundle.resources and webviewInstallMode.path both resolve
          # ../webview2-runtime from src-tauri to ./webview2-runtime).
          if (-not (Test-Path ./webview2-runtime)) {
            Copy-Item -Path "$extractDir" -Destination ./webview2-runtime -Recurse -Force
          }
          Write-Host "WebView2 runtime staged at ./webview2-runtime for Tauri bundling"
          # Clean up the now-redundant extract directory
          Remove-Item -Path $extractDir -Recurse -Force -ErrorAction SilentlyContinue

      - name: Rust checks and tests
        # NOTE: clippy reports without `-D warnings` because the LAN module
        # carries pre-existing style lints (dead `revoke`, complex types);
        # correctness is enforced by `cargo test`. Do not re-add
        # `-D warnings` until those lints are fixed separately.
        run: |
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets
          cargo test --manifest-path src-tauri/Cargo.toml
        shell: pwsh

      - name: Frontend tests
        run: npm test -- --run

      - name: Ensure NSIS is available (GitHub runners usually preinstall it)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $nsisStandardPaths = @(
            'C:\Program Files (x86)\NSIS\makensis.exe',
            'C:\Program Files (x86)\NSIS\Bin\makensis.exe',
            'C:\Program Files\NSIS\makensis.exe',
            'C:\Program Files\NSIS\Bin\makensis.exe'
          )

          $makensisPath = $null

          # Prefer command resolution (covers NSIS preinstalled on the runner).
          if (-not $makensisPath) {
            $cmd = Get-Command makensis -ErrorAction SilentlyContinue
            if ($cmd) { $makensisPath = $cmd.Source }
          }

          # Install NSIS via Chocolatey only if makensis is still not found.
          if (-not $makensisPath) {
            choco install nsis -y --no-progress
            if ($LASTEXITCODE -ne 0) {
              throw "Chocolatey install of NSIS failed with exit code $LASTEXITCODE."
            }
            $cmd = Get-Command makensis -ErrorAction SilentlyContinue
            if ($cmd) { $makensisPath = $cmd.Source }
          }

          # Otherwise check the standard NSIS installation paths.
          if (-not $makensisPath) {
            foreach ($p in $nsisStandardPaths) {
              if (Test-Path $p) {
                $makensisPath = $p
                break
              }
            }
          }

          # Verify the resolved executable exists before invoking it.
          if (-not $makensisPath -or -not (Test-Path $makensisPath)) {
            throw "NSIS is installed but makensis.exe could not be located. Checked paths: $($nsisStandardPaths -join ', ')."
          }

          $nsisDir = Split-Path -Parent $makensisPath

          # Add the NSIS bin directory to the current PowerShell process's PATH.
          $env:PATH = "$env:PATH;$nsisDir"

          # Record the directory in GitHub Actions' persistent workflow PATH.
          "$nsisDir" | Out-File -FilePath $env:GITHUB_PATH -Append

          # Run the version check against the resolved executable path.
          & $makensisPath -VERSION

      - name: Build production Windows installer (NSIS, production config only)
        run: npx tauri build --config src-tauri/tauri.conf.json --config src-tauri/tauri.release.conf.json

      - name: Verify + stage canonical installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = 'src-tauri/target/release/bundle/nsis'
          $exe = Get-ChildItem -Path $dir -Filter '*.exe' -File -ErrorAction Stop |
            Where-Object { $_.Name -notmatch 'Internal' } |
            Sort-Object Length -Descending | Select-Object -First 1
          if (-not $exe) { throw "No production NSIS .exe found in $dir" }
          if ($exe.Length -eq 0) { throw "Installer is empty: $($exe.FullName)" }
          $installerSizeMB = [math]::Round($exe.Length / 1MB, 2)
          Write-Host "Installer size: $installerSizeMB MB"
          # FixedRuntime mode adds ~180MB of WebView2 runtime; the app alone is far
          # smaller, so an installer under 100 MB cannot contain the offline payload.
          if ($installerSizeMB -lt 100) {
            throw "Installer too small ($installerSizeMB MB) to contain the embedded WebView2 offline payload. Expected >100 MB."
          }
          # Confirm the offline WebView2 payload was staged for FixedRuntime
          # bundling (tauri.release.conf.json: resources + fixedRuntime.path).
          # NSIS compresses embedded files, so marker strings do not appear
          # uncompressed in the .exe; verify the staged runtime source instead.
          if (-not (Test-Path -Path './webview2-runtime' -PathType Container)) {
            throw "Offline WebView2 runtime directory './webview2-runtime' was not staged before the build. The FixedRuntime payload cannot be bundled into the installer."
          }
          Write-Host "Installer size ($installerSizeMB MB) and staged FixedRuntime payload at ./webview2-runtime confirm offline WebView2 inclusion."
          $version = (node -p "require('./package.json').version")
          $dest = "PS-Cafe-Setup-$version.exe"
          Copy-Item -Path $exe.FullName -Destination $dest -Force
          Write-Host "Staged release asset: $dest ($($exe.Length) bytes)"

      - name: Publish GitHub Release with installer
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: PS-Cafe-Setup-*.exe
          fail_on_unmatched_files: true
          generate_release_notes: true
