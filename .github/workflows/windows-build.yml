# PS-Cafe — Windows production build (CI artifact per push)
#
# Triggers:
#   - every push to main (primary branch)
#   - pull requests targeting main (build+verify only, no release assets)
#   - manual workflow_dispatch
#
# Builds ONLY the production app (src-tauri/tauri.conf.json, identifier
# com.pscafe.desktop) natively on a Windows runner, verifies the NSIS .exe
# exists and is non-empty, renames it to PS-Cafe-Setup-<version>.exe, and
# uploads it as a uniquely traceable artifact:
#   ps-cafe-windows-<short-sha>-run-<run-number>
#
# Retention: 14 days (temporary CI output; official releases come from tags).
# Artifact names cannot contain ':' on Windows runners, so the name uses
# short-sha + run number for uniqueness and traceability.
# Permissions are read-only (contents: read); publishing happens only in
# release.yml which has contents: write on the tag-triggered job.

name: windows-build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies (reproducible, locked)
        run: npm ci

      - name: Install Rust stable + Windows target
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
          components: clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: TypeScript check
        run: npm run typecheck

      - name: Production frontend build
        run: npm run build:prod

      - name: Rust checks and tests
        # NOTE: clippy reports without `-D warnings` because the LAN module
        # carries pre-existing style lints (dead `revoke`, complex types);
        # correctness is enforced by `cargo test`. Do not re-add
        # `-D warnings` until those lints are fixed separately.
        run: |
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets
          cargo test --manifest-path src-tauri/Cargo.toml
        shell: pwsh

      - name: Frontend tests
        run: npm test -- --run

      - name: Ensure NSIS is available (GitHub runners usually preinstall it)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $nsisStandardPaths = @(
            'C:\Program Files (x86)\NSIS\makensis.exe',
            'C:\Program Files (x86)\NSIS\Bin\makensis.exe',
            'C:\Program Files\NSIS\makensis.exe',
            'C:\Program Files\NSIS\Bin\makensis.exe'
          )

          $makensisPath = $null

          # Prefer command resolution (covers NSIS preinstalled on the runner).
          if (-not $makensisPath) {
            $cmd = Get-Command makensis -ErrorAction SilentlyContinue
            if ($cmd) { $makensisPath = $cmd.Source }
          }

          # Install NSIS via Chocolatey only if makensis is still not found.
          if (-not $makensisPath) {
            choco install nsis -y --no-progress
            if ($LASTEXITCODE -ne 0) {
              throw "Chocolatey install of NSIS failed with exit code $LASTEXITCODE."
            }
            $cmd = Get-Command makensis -ErrorAction SilentlyContinue
            if ($cmd) { $makensisPath = $cmd.Source }
          }

          # Otherwise check the standard NSIS installation paths.
          if (-not $makensisPath) {
            foreach ($p in $nsisStandardPaths) {
              if (Test-Path $p) {
                $makensisPath = $p
                break
              }
            }
          }

          # Verify the resolved executable exists before invoking it.
          if (-not $makensisPath -or -not (Test-Path $makensisPath)) {
            throw "NSIS is installed but makensis.exe could not be located. Checked paths: $($nsisStandardPaths -join ', ')."
          }

          $nsisDir = Split-Path -Parent $makensisPath

          # Add the NSIS bin directory to the current PowerShell process's PATH.
          $env:PATH = "$env:PATH;$nsisDir"

          # Record the directory in GitHub Actions' persistent workflow PATH.
          "$nsisDir" | Out-File -FilePath $env:GITHUB_PATH -Append

          # Run the version check against the resolved executable path.
          & $makensisPath -VERSION

      - name: Build production Windows installer (NSIS, production config only)
        run: npm run build:prod:tauri

      - name: Verify NSIS installer exists and is non-empty
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = 'src-tauri/target/release/bundle/nsis'
          $exe = Get-ChildItem -Path $dir -Filter '*.exe' -File -ErrorAction Stop |
            Where-Object { $_.Name -notmatch 'Internal' } |
            Sort-Object Length -Descending | Select-Object -First 1
          if (-not $exe) { throw "No production NSIS .exe found in $dir" }
          if ($exe.Length -eq 0) { throw "Installer is empty: $($exe.FullName)" }
          "INSTALLER_PATH=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "INSTALLER_NAME=$($exe.Name)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Found installer: $($exe.FullName) ($($exe.Length) bytes)"

      - name: Rename to deterministic filename (PS-Cafe-Setup-<version>.exe)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (node -p "require('./package.json').version")
          $dest = "src-tauri/target/release/bundle/nsis/PS-Cafe-Setup-$version.exe"
          Copy-Item -Path $env:INSTALLER_PATH -Destination $dest -Force
          "CANONICAL_INSTALLER=$dest" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Canonical installer: $dest"

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ps-cafe-windows-${{ github.sha }}-run-${{ github.run_number }}
          path: ${{ env.CANONICAL_INSTALLER }}
          retention-days: 14
          if-no-files-found: error