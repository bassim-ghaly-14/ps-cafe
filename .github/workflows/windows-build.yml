# PS-Cafe — Windows production build (CI artifact per push)
#
# Triggers:
#   - every push to main (primary branch)
#   - pull requests targeting main (build+verify only, no release assets)
#   - manual workflow_dispatch
#
# Builds ONLY the production app (src-tauri/tauri.conf.json, identifier
# com.pscafe.desktop) natively on a Windows runner, verifies the NSIS .exe
# exists and is non-empty, renames it to PS-Cafe-Setup-<version>.exe, and
# uploads it as a uniquely traceable artifact:
#   ps-cafe-windows-<short-sha>-run-<run-number>
#
# Retention: 14 days (temporary CI output; official releases come from tags).
# Artifact names cannot contain ':' on Windows runners, so the name uses
# short-sha + run number for uniqueness and traceability.
# Permissions are read-only (contents: read); publishing happens only in
# release.yml which has contents: write on the tag-triggered job.

name: windows-build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: windows-installer
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies (reproducible, locked)
        run: npm ci

      - name: Install Rust stable + Windows target
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
          components: clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      - name: TypeScript check
        run: npm run typecheck

      - name: Production frontend build
        run: npm run build:prod

      - name: Download and extract WebView2 FixedVersion CAB
        shell: pwsh
        run: |
          $cabUrl = "https://msedge.sf.dl.delivery.mp.microsoft.com/filestreamingservice/files/232cf50b-3980-4531-afbb-779f446d7de1/Microsoft.WebView2.FixedVersionRuntime.155.0.4283.62.x64.cab"
          $cabDest = "src-tauri/webview2-runtime.cab"
          $extractDir = "src-tauri/webview2-runtime"
          Write-Host "Downloading WebView2 FixedVersion CAB..."
          Invoke-WebRequest -Uri $cabUrl -OutFile $cabDest
          Write-Host "Creating extraction directory..."
          if (-not (Test-Path $extractDir)) {
            New-Item -ItemType Directory -Path $extractDir | Out-Null
          }
          Write-Host "Extracting WebView2 CAB with Expand.exe..."
          expand.exe -F:* "$cabDest" "$extractDir"
          if (-not (Test-Path $extractDir)) {
            throw "WebView2 CAB extraction failed: extract directory $extractDir was not created"
          }
          # Verify extraction produced actual runtime files
          $files = Get-ChildItem -Path $extractDir -Recurse -File
          if ($files.Count -eq 0) {
            throw "WebView2 CAB extraction produced no files in $extractDir"
          }
          Write-Host "Extracted $($files.Count) files to $extractDir"
          # Clean up the CAB file after successful extraction
          Remove-Item -Path $cabDest -Force
          # Copy the extracted runtime to the Tauri expected location
          # Tauri's fixedRuntime mode expects the runtime at the path specified in tauri.conf.json
          # The path './webview2-runtime' is relative to the project root
          if (-not (Test-Path ./webview2-runtime)) {
            Copy-Item -Path "$extractDir" -Destination ./webview2-runtime -Recurse -Force
          }
          Write-Host "WebView2 runtime staged at ./webview2-runtime for Tauri bundling"
          # Clean up the now-redundant extract directory
          Remove-Item -Path $extractDir -Recurse -Force -ErrorAction SilentlyContinue

      - name: Rust checks and tests
        # NOTE: clippy reports without `-D warnings` because the LAN module
        # carries pre-existing style lints (dead `revoke`, complex types);
        # correctness is enforced by `cargo test`. Do not re-add
        # `-D warnings` until those lints are fixed separately.
        run: |
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets
          cargo test --manifest-path src-tauri/Cargo.toml
        shell: pwsh

      - name: Frontend tests
        run: npm test -- --run

      - name: Ensure NSIS is available (GitHub runners usually preinstall it)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $nsisStandardPaths = @(
            'C:\Program Files (x86)\NSIS\makensis.exe',
            'C:\Program Files (x86)\NSIS\Bin\makensis.exe',
            'C:\Program Files\NSIS\makensis.exe',
            'C:\Program Files\NSIS\Bin\makensis.exe'
          )

          $makensisPath = $null

          # Prefer command resolution (covers NSIS preinstalled on the runner).
          if (-not $makensisPath) {
            $cmd = Get-Command makensis -ErrorAction SilentlyContinue
            if ($cmd) { $makensisPath = $cmd.Source }
          }

          # Install NSIS via Chocolatey only if makensis is still not found.
          if (-not $makensisPath) {
            choco install nsis -y --no-progress
            if ($LASTEXITCODE -ne 0) {
              throw "Chocolatey install of NSIS failed with exit code $LASTEXITCODE."
            }
            $cmd = Get-Command makensis -ErrorAction SilentlyContinue
            if ($cmd) { $makensisPath = $cmd.Source }
          }

          # Otherwise check the standard NSIS installation paths.
          if (-not $makensisPath) {
            foreach ($p in $nsisStandardPaths) {
              if (Test-Path $p) {
                $makensisPath = $p
                break
              }
            }
          }

          # Verify the resolved executable exists before invoking it.
          if (-not $makensisPath -or -not (Test-Path $makensisPath)) {
            throw "NSIS is installed but makensis.exe could not be located. Checked paths: $($nsisStandardPaths -join ', ')."
          }

          $nsisDir = Split-Path -Parent $makensisPath

          # Add the NSIS bin directory to the current PowerShell process's PATH.
          if ($nsisDir) {
            $env:PATH = "$env:PATH;$nsisDir"
            # Record the directory in GitHub Actions' persistent workflow PATH.
            "$nsisDir" | Out-File -FilePath $env:GITHUB_PATH -Append
          } else {
            Write-Warning "NSIS directory could not be determined - PATH will not include NSIS bin directory"
          }

          # Run the version check against the resolved executable path.
          & $makensisPath -VERSION

      - name: Build production Windows installer (NSIS, production config only)
        run: npx tauri build --config src-tauri/tauri.conf.json --config src-tauri/tauri.release.conf.json

      - name: Verify NSIS installer exists and is non-empty
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = 'src-tauri/target/release/bundle/nsis'
          $exe = Get-ChildItem -Path $dir -Filter '*.exe' -File -ErrorAction Stop |
            Where-Object { $_.Name -notmatch 'Internal' } |
            Sort-Object Length -Descending | Select-Object -First 1
          if (-not $exe) { throw "No production NSIS .exe found in $dir" }
          if ($exe.Length -eq 0) { throw "Installer is empty: $($exe.FullName)" }
          "INSTALLER_PATH=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "INSTALLER_NAME=$($exe.Name)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Found installer: $($exe.FullName) ($($exe.Length) bytes)"
          # Validate that WebView2 runtime is included in the installer
          $runtimeDir = Join-Path $dir "webview2-runtime"
          if (Test-Path $runtimeDir) {
            $runtimeFiles = Get-ChildItem -Path $runtimeDir -Recurse -File | Measure-Object
            Write-Host "WebView2 runtime directory found in installer with $($runtimeFiles.Count) files"
            "$RUNTIME_DIR_EXISTS=true" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          } else {
            Write-Warning "WebView2 runtime directory NOT found in installer at $runtimeDir"
            "$RUNTIME_DIR_EXISTS=false" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            throw "WebView2 runtime directory is missing from the NSIS output! The installed application will not be able to find the WebView2 Runtime."
          }

      - name: Rename to deterministic filename (PS-Cafe-Setup-<version>.exe)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (node -p "require('./package.json').version")
          $dest = "src-tauri/target/release/bundle/nsis/PS-Cafe-Setup-$version.exe"
          Copy-Item -Path $env:INSTALLER_PATH -Destination $dest -Force
          "CANONICAL_INSTALLER=$dest" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Canonical installer: $dest"

      - name: Stage canonical installer at repo root
        shell: pwsh
        run: |
          $version = (node -p "require('./package.json').version")
          $src = "src-tauri/target/release/bundle/nsis/PS-Cafe-Setup-$version.exe"
          $dst = "PS-Cafe-Setup-$version.exe"
          Copy-Item -Path $src -Destination $dst -Force
          Write-Host "Staged installer at repo root: $dst"

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ps-cafe-windows-${{ github.sha }}-run-${{ github.run_number }}
          path: ${{ env.CANONICAL_INSTALLER }}
          retention-days: 14
          if-no-files-found: error

      - name: Update existing GitHub Release asset (v0.1.0)
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: v0.1.0
          files: PS-Cafe-Setup-0.1.0.exe
          fail_on_unmatched_files: false